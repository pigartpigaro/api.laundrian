services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laundrian-api
    restart: unless-stopped
    working_dir: /var/www
    ports:
      - "8020:8000"
    volumes:
      - ./:/var/www
      - laundrian_vendor:/var/www/vendor
    env_file:
      - .env
    environment:
      DB_ROOT_PASSWORD: ""
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: laundrian-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:3308:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - laundrian_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  laundrian_mysql:
    name: apilondrian_mysql
  laundrian_vendor:
    name: apilondrian_vendor
